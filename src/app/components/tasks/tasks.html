<div class="nebula-container">

  <div class="main-box">

    <button class="btn-regresar" routerLink="/home">
      🔙 Volver a la pagina principal
    </button>

    <h1 class="page-title">Mis Tareas</h1>

    <div class="form-box">

      <h2 class="form-title">{{ editando ? 'Editar Tarea' : 'Nueva Tarea' }}</h2>

      <div class="input-group">
        <label>Titulo</label>
        <input 
          type="text" 
          placeholder="Titulo de la tarea" 
          [(ngModel)]="nuevaTarea.title" />
      </div>

      <div class="input-group">
        <label>Descripcion</label>
        <input 
          type="text" 
          placeholder="Descripcion de la tarea" 
          [(ngModel)]="nuevaTarea.description" />
      </div>

      <div class="input-group">
        <label>Estado</label>
        <select [(ngModel)]="nuevaTarea.status">
          <option value="Pendiente">Pendiente</option>
          <option value="En Progreso">En Progreso</option>
          <option value="Completado">Completada</option>
        </select>
      </div>

      <div class="input-group">
        <label>Prioridad</label>
        <select [(ngModel)]="nuevaTarea.priority">
          <option value="Baja">Baja</option>
          <option value="Media">Media</option>
          <option value="Alta">Alta</option>
        </select>
      </div>

      <div class="input-group">
        <label>Fecha Limite</label>
        <input 
          type="date" 
          [(ngModel)]="nuevaTarea.dueDate" />
      </div>

      <div class="input-group">
        <label>Categoria</label>
        <select [(ngModel)]="nuevaTarea.categoryId"> 
          <option [ngValue]="null">Sin categoría</option>
          <option *ngFor="let cat of categories" [ngValue]="cat.id">
            {{ cat.icon }} {{ cat.name }}
          </option>
        </select>
      </div>
      
      <p class="error-msg" *ngIf="errorTarea">{{ errorTarea }}</p>
      <p class="success-msg" *ngIf="mensajeExito">{{ mensajeExito }}</p>

      <div style="display: flex; gap: 10px;">
        <button class="btn-principal" (click)="editando ? actualizarTarea() : crearTarea()">
          {{ editando ? 'Guardar Cambios' : 'Crear Tarea' }}
        </button>
        <button class="btn-eliminar" *ngIf="editando" (click)="cancelarEdicion()" style="background: #555;">
          Cancelar
        </button>
      </div>

    </div>

    <div class="list-box">

      <h2 class="form-title">Lista de Tareas</h2>

      <p class="empty-msg" *ngIf="tasks.length === 0">
        Aun No Hay Tareas
      </p>

      <div class="task-item" *ngFor="let task of tasks">

        <div class="task-info">
          <span class="task-title">{{ task.title }}</span>
          <span class="task-desc">{{ task.description }}</span>

          <div class="task-tags">
            <span class="tag-status" [ngClass]="getStatusClass(task.status)">
              {{ task.status }}
            </span>
            <span class="tag-priority" [ngClass]="getPriorityClass(task.priority)">
              {{ task.priority }}
            </span>
            <span class="tag-date" *ngIf="task.dueDate">
              {{ task.dueDate | date:'shortDate' }}
            </span>
            <span class="tag-category" *ngIf="task.categoryId">
              Categoría #{{ task.categoryId }}
            </span>
          </div>
        </div>

        <div style="display: flex; gap: 8px; align-items: center;">
          <button class="btn-principal" style="padding: 5px 10px; font-size: 14px;" (click)="seleccionarParaEditar(task)">
            Editar
          </button>
          <button class="btn-eliminar" (click)="eliminarTarea(task.id)">
            Eliminar
          </button>
        </div>

      </div>

    </div>

  </div>
</div>
